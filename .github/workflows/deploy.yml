name: Deploy to MakeMySiteLive

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to MakeMySiteLive API
        run: |
          curl -X POST "https://makemysitelive.com/v1/microsites/{id}/deploy-html" \
            -H "Authorization: Bearer ${{ secrets.MAKEMYSITELIVE_API_KEY }}" \
            -F "file=@Aethoria.html"
